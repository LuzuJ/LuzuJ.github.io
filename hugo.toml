baseURL = 'https://luzuj.github.io/'
theme = 'PaperMod'
defaultContentLanguage = 'es'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'

[params]
  env = 'production'
  author = 'Jonathan Luzuriaga'
  mainSections = ["sistemas-distribuidos", "investigacion-ia", "operaciones-cicd"]
  
  defaultTheme = 'dark'
  disableThemeToggle = false
  disableLangToggle = false
  displayFullLangName = true

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = true

  [params.assets]
    disableHLJS = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/LuzuJ"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jonathan-luzuriaga/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:jonaluzu1@gmail.com"

